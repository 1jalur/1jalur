<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnosa koneksi PRODUKSI</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#1b2335;--mu:#6b7385;--bd:#e3e7f0;--ok:#16a34a;--no:#dc2626;--wa:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0b1426;--sf:#121c33;--tx:#e8ecf6;--mu:#9aa6c0;--bd:#24304f;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mu);margin:0 0 16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:flex-start}.ic{font-size:18px;width:24px;text-align:center;flex:none}
.t{font-weight:600}.d{color:var(--mu);font-size:13px;word-break:break-word}
.ok .ic{color:var(--ok)}.no .ic{color:var(--no)}.wa .ic{color:var(--wa)}.run .ic{color:var(--mu)}
.hint{margin-top:6px;font-size:13px}.no .hint{color:var(--no)}.wa .hint{color:var(--wa)}
button,a.b{font:inherit;font-weight:600;background:#4f5bd5;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 6px 4px 0}
button.g,a.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
code{background:var(--bd);padding:1px 6px;border-radius:4px;word-break:break-all}
</style></head><body><main>
<h1>Diagnosa koneksi PRODUKSI</h1>
<p>Halaman ini memeriksa alamat server yang dipakai aplikasi ini (dari <code>js/config.js</code>) langsung dari browser Anda. Tidak ada kode rahasia yang diminta atau ditampilkan.</p>
<div><button id="go" onclick="jalan()">Periksa lagi</button><button class="g" id="cp" onclick="salin()">Salin hasil</button><a class="b g" href="./">Kembali ke aplikasi</a></div>
<div id="out"></div>
<script src="js/config.js"></script>
<script>
/* Setiap pemeriksaan: {s:'ok'|'no'|'wa', t:judul, d:rincian, h:saran} */
const POLA=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
const pot=x=>String(x||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
async function diagnosa(url,f,env){
  const R=[];const add=(s,t,d,h)=>R.push({s,t,d:d||'',h:h||''});
  env=env||{};
  add('ok','Alamat situs',env.situs||'-');
  if(!url){add('no','URL server di config.js kosong','window.GAS_URL belum diisi pada situs yang sedang berjalan.','Isi js/config.js di GitHub, tunggu Vercel selesai (status Ready), lalu tekan Ctrl+F5.');return R}
  add('ok','URL server yang dipakai situs ini',url);
  if(!POLA.test(url)){add('no','Format URL tidak benar','Harus berbentuk https://script.google.com/macros/s/.../exec','Salin ulang dari Apps Script: Terapkan > Kelola deployment > URL aplikasi web. Jangan ada spasi, tanda ?, atau akhiran /dev atau /edit.');return R}
  add('ok','Format URL benar','berakhiran /exec');
  let nc=false;
  try{await f(url+'?action=versi',{mode:'no-cors'});nc=true;add('ok','Server dapat dijangkau dari jaringan ini','script.google.com merespons.')}
  catch(e){add('no','Server tidak dapat dijangkau','Galat jaringan: '+pot(e&&e.message),'Periksa internet, VPN, DNS, atau ekstensi pemblokir iklan/keamanan. Coba jaringan lain (mis. hotspot HP).');return R}
  let t,st;
  try{const r=await f(url+'?action=versi');st=r.status;t=await r.text()}
  catch(e){add('no','Browser menolak membaca jawaban server (CORS)','Server menjawab, tetapi tanpa izin dibaca oleh situs ini. Ini yang membuat aplikasi menampilkan "Failed to fetch".','Penyebab paling umum: (1) URL milik deployment yang sudah dihapus atau salah, (2) akses deployment bukan "Siapa saja" sehingga Google menampilkan halaman login, (3) kuota harian Apps Script habis. Klik "Buka URL di tab baru" di bawah dan lihat halaman apa yang muncul.');return R}
  let j;try{j=JSON.parse(t)}catch(e){add('no','Server membalas halaman, bukan data','HTTP '+(st||'?')+': '+pot(t),'Jika isinya "Sign in" atau "Masuk": ubah akses deployment menjadi "Siapa saja". Jika "tidak dapat membuka file": URL salah atau deployment dihapus.');return R}
  if(!j||j.ok!==true){add('no','Server menjawab dengan galat',pot(JSON.stringify(j)),'Buka Apps Script > Eksekusi untuk melihat penyebabnya.');return R}
  add('ok','Server membalas data dengan benar','versi '+j.versi+' · TOKEN '+(j.siap?'sudah diatur':'BELUM diatur')+' · login Google '+(j.google?'aktif':'belum diatur'));
  if(!String(j.versi||'').startsWith('3.'))add('wa','Skrip yang berjalan versi lama','versi '+j.versi,'Tempel Kode.gs terbaru lalu Terapkan > Kelola deployment > pensil > Versi baru > Terapkan.');
  if(!j.siap)add('wa','TOKEN belum diatur di Kode.gs','','Ganti TOKEN (minimal 6 karakter), simpan, lalu terbitkan versi baru.');
  try{const r=await f(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',u:'diagnosa',p:'diagnosa-tes'})});const x=JSON.parse(await r.text());
    add(x&&x.ok===false&&x.error?'ok':'wa','Pengiriman (POST) untuk login dapat dibaca','Jawaban server: '+pot(x&&x.error||JSON.stringify(x)),x&&x.ok===false?'':'Jawaban tidak seperti yang diharapkan; kirim hasil ini ke pengembang.')}
  catch(e){add('no','Pengiriman (POST) untuk login gagal dibaca',pot(e&&e.message),'GET berhasil tetapi POST tidak: periksa bahwa deployment terbaru memakai kode terbaru (Versi baru).')}
  return R}
let HASIL=[];
const IK={ok:'✔',no:'✖',wa:'⚠',run:'…'};
function tampil(R){HASIL=R;document.getElementById('out').innerHTML=R.map(x=>`<div class="card ${x.s}"><div class="row"><div class="ic">${IK[x.s]}</div><div><div class="t">${esc(x.t)}</div>${x.d?`<div class="d">${esc(x.d)}</div>`:''}${x.h?`<div class="hint">${esc(x.h)}</div>`:''}</div></div></div>`).join('')+(window.GAS_URL?`<div class="card"><div class="t">Lihat langsung</div><div class="d">Jika hasil di atas gagal, buka alamat ini di tab baru. Harus tampil tulisan seperti {"ok":true,"versi":...}.</div><a class="b g" target="_blank" rel="noopener" href="${esc(window.GAS_URL)}?action=versi">Buka URL di tab baru</a></div>`:'')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function jalan(){const b=document.getElementById('go');b.disabled=true;document.getElementById('out').innerHTML='<div class="card run"><div class="row"><div class="ic">…</div><div class="t">Memeriksa…</div></div></div>';
  try{tampil(await diagnosa(String(window.GAS_URL||'').trim(),(u,o)=>fetch(u,o),{situs:location.origin}))}catch(e){tampil([{s:'no',t:'Pemeriksaan gagal',d:pot(e&&e.message)}])}b.disabled=false}
function salin(){const tx=HASIL.map(x=>IK[x.s]+' '+x.t+(x.d?' — '+x.d:'')+(x.h?' → '+x.h:'')).join('\n');(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>{document.getElementById('cp').textContent='Tersalin'},()=>{prompt('Salin teks ini:',tx)})}
jalan();
</script></main></body></html>
